<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Outside | Checkout</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/checkout.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider checkout">
    <h2>Review & Place your Order</h2>
    <section class="checkout__container">
      <form name="checkout"  class="checkout-form">
        <input type="hidden" name="orderDate" id="orderDate">

        <fieldset>
          <legend></legend>
          <div class="checkout__name">
            <label for="fname">First Name</label>
            <input type="text" name="fname" id="fname" required>
            <label for="lname">Last Name</label>
            <input type="text" name="lname" id="lname" required>
          </div>
          <div class="checkout__address">
            <label for="street">Street Address</label>
            <input type="text" name="street" id="street" required>
            <label for="city">City</label>
            <input type="text" name="city" id="city" required>
            <label for="state">State</label>
            <input type="text" name="state" id="state" required>
           <label for="zip">Zip Code</label>
            <input type="text" id="zip" name="zip" inputmode="numeric" maxlength="5" pattern="\d{5}" placeholder="12345" required title="Enter 5 digits">
          </div>
        </fieldset>

        <fieldset>
          <legend>Payment</legend>
          <div class="checkout__payment">
           <label for="cardNumber">Card Number</label>
<input type="text" id="cardNumber" name="cardNumber" inputmode="numeric" maxlength="16" pattern="\d{16}" placeholder="1234123412341234" required>

<label for="expiration">Expiration</label>
<input type="text" id="expiration" name="expiration" inputmode="numeric" maxlength="5" pattern="\d{2}/\d{2}" placeholder="MM/YY" required>

<label for="code">CVV</label>
<input type="text" id="code" name="code" inputmode="numeric" maxlength="4" pattern="\d{3,4}" placeholder="123" required >


          </div>
        </fieldset>

        <fieldset class="checkout-summary">
          <legend>Order Summary</legend>

          <div class="order__summary">
            <div>Items</div>
            <div id="num-items"></div>
            <div>Subtotal</div>
            <div id="cartTotal"></div>
            <div>Tax</div>
            <div id="tax"></div>
            <div>Shipping</div>
            <div id="shipping"></div>
            <div>Total</div>
            <div id="orderTotal"></div>
          </div>
        </fieldset>
        <button type="submit" id="checkoutSubmit">Checkout</button>
      </form>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
