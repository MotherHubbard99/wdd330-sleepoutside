<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Your Cart</title>
    <link rel="stylesheet" href="../css/style.css" />

    <title>Sleep Outside | Cart</title>

    <link rel="stylesheet" href="../css/style.css" />

    <script src="../js/cart.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>My Cart</h2>

        <ul class="cart-product-list"></ul>

        <div class="cart-total-container hide">
          <p class="cart-total-text">
            Total: <span id="cart-total-amount">$0.00</span>
          </p>
        </div>

        <div
          class="checkout-actions"
          style="margin-top: 2rem; text-align: right"
        >
          <a
            href="../checkout/index.html"
            id="checkout-btn"
            class="btn-submit"
            style="
              text-decoration: none;
              display: inline-block;
              padding: 0.75rem 2rem;
            "
          >
            Proceed to Checkout
          </a>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>

    <script type="module" src="/js/cart.js"></script>
  </body>
</html>
